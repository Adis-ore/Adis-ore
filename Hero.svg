<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Physics x Code x Energy x Aerodynamics" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#161b33"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <g id="plane">
      <path d="M-24,0 Q-24,-4 -16,-4 L14,-4 Q26,-3 30,0 Q26,3 14,4 L-16,4 Q-24,4 -24,0Z" fill="#e6edf3"/>
      <path d="M-22,-3 L-29,-15 L-20,-15 L-11,-3Z" fill="#58a6ff"/>
      <path d="M-2,2 L-15,13 L-6,13 L11,2Z" fill="#9db4d6"/>
      <circle cx="18" cy="-1" r="1.8" fill="#58a6ff"/>
    </g>
  </defs>

  <rect width="900" height="260" rx="14" fill="url(#sky)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="30" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="55" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="22" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="40" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="24" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="58" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- drifting clouds -->
  <g fill="#ffffff" opacity="0.07">
    <g>
      <ellipse cx="0" cy="190" rx="60" ry="14"/><ellipse cx="35" cy="182" rx="40" ry="12"/>
      <animateTransform attributeName="transform" type="translate" from="960 0" to="-160 0" dur="28s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="0" cy="105" rx="50" ry="11"/><ellipse cx="30" cy="99" rx="32" ry="10"/>
      <animateTransform attributeName="transform" type="translate" from="1050 0" to="-160 0" dur="38s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- title -->
  <text x="450" y="62" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="26" font-weight="700" fill="url(#title)">Physics × Code × Energy × Aerodynamics</text>

  <!-- vapor trail (circles follow the plane with a delay) -->
  <g fill="#ffffff">
    <circle r="2" opacity="0"><set attributeName="opacity" to="0.15" begin="0.7s"/><animateMotion dur="9s" begin="0.7s" repeatCount="indefinite" path="M -60,150 C 150,90 300,200 450,130 S 750,80 960,140"/></circle>
    <circle r="3" opacity="0"><set attributeName="opacity" to="0.25" begin="0.5s"/><animateMotion dur="9s" begin="0.5s" repeatCount="indefinite" path="M -60,150 C 150,90 300,200 450,130 S 750,80 960,140"/></circle>
    <circle r="3.5" opacity="0"><set attributeName="opacity" to="0.4" begin="0.3s"/><animateMotion dur="9s" begin="0.3s" repeatCount="indefinite" path="M -60,150 C 150,90 300,200 450,130 S 750,80 960,140"/></circle>
    <circle r="3" opacity="0"><set attributeName="opacity" to="0.55" begin="0.15s"/><animateMotion dur="9s" begin="0.15s" repeatCount="indefinite" path="M -60,150 C 150,90 300,200 450,130 S 750,80 960,140"/></circle>
  </g>

  <!-- the plane -->
  <use href="#plane">
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" path="M -60,150 C 150,90 300,200 450,130 S 750,80 960,140"/>
  </use>

  <!-- equations -->
  <g font-family="'Fira Code','Courier New',monospace" font-size="18" text-anchor="middle" fill="#79c0ff">
    <text x="190" y="236">H|ψ⟩ = E|ψ⟩<animate attributeName="opacity" values="0.35;1;0.35" dur="4s" begin="0s" repeatCount="indefinite"/></text>
    <text x="450" y="236">F = ma<animate attributeName="opacity" values="0.35;1;0.35" dur="4s" begin="1.3s" repeatCount="indefinite"/></text>
    <text x="710" y="236">L = ½ρv²S·C<tspan font-size="12" dy="4">L</tspan><animate attributeName="opacity" values="0.35;1;0.35" dur="4s" begin="2.6s" repeatCount="indefinite"/></text>
  </g>
</svg>
